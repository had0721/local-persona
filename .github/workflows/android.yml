name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android NDK
        id: ndk
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] && [ -n "${ANDROID_NDK_ROOT:-}" ]; then NDK="$ANDROID_NDK_ROOT"; fi
          if [ -z "$NDK" ]; then
            NDK=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK"

      - name: Fetch llama.cpp (pinned)
        run: |
          set -eux
          git clone --depth 1 --branch v0.9.0 https://github.com/ggml-org/llama.cpp llama.cpp
          du -sh llama.cpp

      - name: Build libpersona.so for arm64-v8a
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}
        run: |
          set -eux
          cmake --version
          cat "$NDK/source.properties" || true
          cmake -S app/src/main/cpp -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=OFF
          cmake --build build-native -j"$(nproc)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-native/libpersona.so app/src/main/jniLibs/arm64-v8a/
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: persona-debug-keystore-v1

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify native lib is packaged
        run: |
          set -eux
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libpersona.so" \
            || { echo "::error::libpersona.so 没有被打进 APK"; exit 1; }

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPersona-apk
          path: out/*.apk
          retention-days: 30
